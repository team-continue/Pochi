[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "pochi-rl"
version = "0.1.0"
description = "Pochi quadruped reinforcement-learning pipeline for mjlab, with Isaac Lab-ready shared task specs."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "gymnasium>=1.2.0",
  "mjlab",
  "mujoco>=3.8.0",
  "numpy>=2.0.0",
  "onnx>=1.18.0",
  "onnxscript>=0.5.4",
  "rsl-rl-lib==5.2.0",
  "tensorboard>=2.20.0",
  "torch>=2.7.0",
  "tyro>=1.0.1",
]

[project.entry-points."mjlab.tasks"]
pochi_rl = "pochi_rl.mjlab.tasks"

[dependency-groups]
cad = [
    "onshape-to-robot>=1.8.2",
    "trimesh>=4.5.0",
    "fast-simplification>=0.1.7",
]
dev = [
  "mypy>=1.15.0",
  "pytest>=8.3.0",
  "pytest-xdist>=3.6.0",
  "ruff>=0.11.0",
]

[tool.uv.sources]
mjlab = { git = "https://github.com/mujocolab/mjlab.git", rev = "9a43f2d508b963e8caf4af1e7c1d2533d4289287" }

[tool.ruff]
line-length = 88
indent-width = 2
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
