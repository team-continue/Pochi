[platformio]
default_envs = teensy41

[env:teensy41]
platform = teensy@5.2.0
board = teensy41
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 115200
build_flags =
  -DICM_20948_USE_DMP
  -include string.h
lib_deps =
  sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library@1.3.2
